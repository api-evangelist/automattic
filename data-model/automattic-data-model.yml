  site: >-
    Every site-scoped path accepts either a numeric site ID or a domain in the {site} segment
    ("Site ID or domain", per the help document).
  global_id: >-
    Posts carry a global_ID that is unique across all of WordPress.com, in addition to the
    site-scoped ID — the join key for cross-site Reader endpoints.
  slug_addressing: >-
    Categories, tags and posts are also addressable by slug via the `slug:{value}` path form
    (e.g. /sites/{site}/posts/slug:{post_slug}).
