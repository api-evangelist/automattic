tags:
- name: ssh-migration
paths:
  /wpcom/v2/sites/{wpcom_site}/ssh-migration:
    get:
      operationId: getWpcomV2SitesbyWpcomSiteSshMigration
      summary: GET /wpcom/v2/sites/{wpcom_site}/ssh-migration
      tags:
      - ssh-migration
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      parameters:
      - name: wpcom_site
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: postWpcomV2SitesbyWpcomSiteSshMigration
      summary: POST /wpcom/v2/sites/{wpcom_site}/ssh-migration
      tags:
      - ssh-migration
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      parameters:
      - name: wpcom_site
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                migration_source_site_domain:
                  type: string
                  description: Source site domain for the migration
              required:
              - migration_source_site_domain
  /wpcom/v2/sites/{wpcom_site}/ssh-migration/configure:
    post:
      operationId: postWpcomV2SitesbyWpcomSiteSshMigrationConfigure
      summary: POST /wpcom/v2/sites/{wpcom_site}/ssh-migration/configure
      tags:
      - ssh-migration
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      parameters:
      - name: wpcom_site
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remote_host:
                  type: string
                  description: Remote host to connect to
                remote_user:
                  type: string
                  description: SSH username for the source site
                remote_domain:
                  type: string
                  description: Domain of the source site
                remote_port:
                  type: integer
                  description: SSH port for the source site
              required:
              - remote_host
              - remote_user
              - remote_domain
  /wpcom/v2/sites/{wpcom_site}/ssh-migration/start:
    post:
      operationId: postWpcomV2SitesbyWpcomSiteSshMigrationStart
      summary: POST /wpcom/v2/sites/{wpcom_site}/ssh-migration/start
      tags:
      - ssh-migration
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      parameters:
      - name: wpcom_site
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remote_host:
                  type: string
                  description: Remote host to connect to
                remote_user:
                  type: string
                  description: SSH username for the source site
                remote_domain:
                  type: string
                  description: Domain of the source site
                remote_pass:
                  type: string
                  description: SSH password for the source site
                remote_docroot:
                  type: string
                  description: Document root path on the source site
                ssh_id:
                  type: string
                  description: SSH key identity data
                ssh_id_pass:
                  type: string
                  description: Passphrase for the SSH key
                remote_port:
                  type: integer
                  description: SSH port for the source site
              required:
              - remote_host
              - remote_user
              - remote_domain
  /wpcom/v2/sites/{wpcom_site}/ssh-migration/status:
    get:
      operationId: getWpcomV2SitesbyWpcomSiteSshMigrationStatus
      summary: GET /wpcom/v2/sites/{wpcom_site}/ssh-migration/status
      tags:
