- url: https://public-api.wordpress.com
security:
- bearerAuth: []
tags:
- name: taxonomies
paths:
  /wp/v2/sites/{wpcom_site}/taxonomies:
    get:
      operationId: getWpV2SitesbyWpcomSiteTaxonomies
      summary: GET /wp/v2/sites/{wpcom_site}/taxonomies
      tags:
      - taxonomies
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      parameters:
      - name: wpcom_site
        in: path
        required: true
        schema:
          type: string
      - name: context
        in: query
        required: false
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
        description: Scope under which the request is made; determines fields present in response.
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: Limit results to taxonomies associated with a specific post type.
  /wp/v2/sites/{wpcom_site}/taxonomies/{taxonomy}:
    get:
      operationId: getWpV2SitesbyWpcomSiteTaxonomiesbyTaxonomy
      summary: GET /wp/v2/sites/{wpcom_site}/taxonomies/{taxonomy}
      tags:
      - taxonomies
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      parameters:
      - name: wpcom_site
        in: path
        required: true
        schema:
          type: string
      - name: taxonomy
        in: path
        required: true
        schema:
          type: string
      - name: context
        in: query
        required: false
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
        description: Scope under which the request is made; determines fields present in response.
