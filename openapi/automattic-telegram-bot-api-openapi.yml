paths:
  /wpcom/v2/telegram-bot/assistant-webhook/{assistant_bot}:
    post:
      operationId: postWpcomV2TelegramBotAssistantWebhookbyAssistantBot
      summary: POST /wpcom/v2/telegram-bot/assistant-webhook/{assistant_bot}
      tags:
      - telegram-bot
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      parameters:
      - name: assistant_bot
        in: path
        required: true
        schema:
          type: string
  /wpcom/v2/telegram-bot/connect:
    post:
      operationId: postWpcomV2TelegramBotConnect
      summary: POST /wpcom/v2/telegram-bot/connect
      tags:
      - telegram-bot
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                auth_date:
                  type: integer
                hash:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                username:
                  type: string
                photo_url:
                  type: string
              required:
              - id
              - auth_date
              - hash
  /wpcom/v2/telegram-bot/connect-via-token:
    post:
      operationId: postWpcomV2TelegramBotConnectViaToken
      summary: POST /wpcom/v2/telegram-bot/connect-via-token
      tags:
      - telegram-bot
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                telegram_id:
                  type: integer
                token:
                  type: string
                ts:
                  type: integer
                bot:
                  type: string
              required:
              - telegram_id
              - token
              - ts
  /wpcom/v2/telegram-bot/disconnect:
    post:
      operationId: postWpcomV2TelegramBotDisconnect
      summary: POST /wpcom/v2/telegram-bot/disconnect
      tags:
      - telegram-bot
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
