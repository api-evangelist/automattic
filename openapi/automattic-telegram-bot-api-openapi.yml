  /wpcom/v2/telegram-bot/local-agent-poll:
    get:
      operationId: getWpcomV2TelegramBotLocalAgentPoll
      summary: GET /wpcom/v2/telegram-bot/local-agent-poll
      tags:
      - telegram-bot
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
  /wpcom/v2/telegram-bot/local-agent-respond:
    post:
      operationId: postWpcomV2TelegramBotLocalAgentRespond
      summary: POST /wpcom/v2/telegram-bot/local-agent-respond
      tags:
      - telegram-bot
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                text:
                  type: string
                caption:
                  type: string
                bot:
                  type: string
                action:
                  type: string
                  enum:
                  - create
                  - edit
                  - delete
                  - chat_action
                  default: create
                message_id:
                  type: integer
              required:
              - chat_id
              - bot
