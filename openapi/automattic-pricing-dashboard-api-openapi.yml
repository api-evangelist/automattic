        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p2_url:
                  type: string
                  format: uri
                data:
                  type: object
                dry_run:
                  type: boolean
              required:
              - p2_url
              - data
  /wpcom/v2/pricing-dashboard/prod-sync:
    post:
