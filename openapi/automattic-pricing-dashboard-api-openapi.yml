    get:
      operationId: getWpcomV2PricingDashboardPrices
      summary: GET /wpcom/v2/pricing-dashboard/prices
      tags:
      - pricing-dashboard
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      parameters:
      - name: products
        in: query
        required: true
        schema: {}
        description: The product IDs to fetch prices for. Can be a comma-separated string or an array of integers.
      - name: env
        in: query
        required: true
        schema:
          type: string
          enum:
          - staging
          - production
    post:
      operationId: postWpcomV2PricingDashboardPrices
      summary: POST /wpcom/v2/pricing-dashboard/prices
      tags:
