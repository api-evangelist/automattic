paths:
  /wpcom/v2/pricing-dashboard/currencies:
    get:
      operationId: getWpcomV2PricingDashboardCurrencies
      summary: GET /wpcom/v2/pricing-dashboard/currencies
      tags:
      - pricing-dashboard
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
