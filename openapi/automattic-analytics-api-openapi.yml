          - day
          - week
          - month
          - quarter
          - year
        description: The time interval for the report.
      - name: date_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - created
          - paid
          - completed
        description: The order date field to use for filtering (created, paid, completed). When specified, filters by order dates instead of booking dates.
