          type: string
          format: date-time
        description: Start date/time (ISO8601) for the report. e.g. 2020-01-01T12:00:00.
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: End date/time (ISO8601) for the report. e.g. 2020-03-01T16:00:00.
