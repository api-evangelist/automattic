        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      parameters:
      - name: schedule_id
        in: path
        required: true
        schema:
          type: string
      - name: appointment_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                begin_timestamp:
                  type: integer
                  description: The new appointment start time
                meta:
                  type: string
                  description: A json blob string that includes the meta data of this appointment.
  /wpcom/v2/concierge/schedules/{schedule_id}/appointments/{appointment_id}/update-conference-link:
    post:
      operationId: postWpcomV2ConciergeSchedulesbyScheduleIdAppointmentsbyAppointmentIdUpdateConferenceLink
      summary: POST /wpcom/v2/concierge/schedules/{schedule_id}/appointments/{appointment_id}/update-conference-link
      tags:
