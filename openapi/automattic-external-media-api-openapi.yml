  /wpcom/v2/sites/{wpcom_site}/external-media/copy/{service}:
    post:
      operationId: postWpcomV2SitesbyWpcomSiteExternalMediaCopybyService
      summary: POST /wpcom/v2/sites/{wpcom_site}/external-media/copy/{service}
      tags:
      - external-media
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      parameters:
      - name: wpcom_site
        in: path
        required: true
        schema:
          type: string
      - name: service
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                media:
                  type: array
                  items:
                    type: array
                  description: Media data to copy.
                post_id:
                  type: number
                  description: The post ID to attach the upload to.
                should_proxy:
                  type: boolean
                  default: false
                  description: Whether to proxy the media request.
              required:
              - media
