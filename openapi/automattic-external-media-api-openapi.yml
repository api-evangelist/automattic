      parameters:
      - name: wpcom_site
        in: path
        required: true
        schema:
          type: string
      - name: service
        in: path
        required: true
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Media collection search term.
      - name: number
        in: query
        required: false
        schema:
          type: number
          default: 20
        description: Number of media items in the request
      - name: path
        in: query
        required: false
        schema:
          type: string
      - name: page_handle
        in: query
        required: false
        schema:
          type: string
      - name: session_id
        in: query
        required: false
        schema:
          type: string
        description: Session id of a service, currently only Google Photos Picker
