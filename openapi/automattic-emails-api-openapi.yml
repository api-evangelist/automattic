        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the mailbox owner/user
                mailbox:
                  type: string
                  description: The mailbox name i.e. the email address excluding the domain
                password:
                  type: string
                  description: The password to authenticate users who want to access the mailbox
                alternate_email_address:
                  type: string
                  description: The alternate email address for password resets and notifications
                is_admin:
                  type: boolean
                  default: false
                  description: Whether this user should have administrative permissions/privileges for the domain
              required:
              - name
              - mailbox
              - password
              - alternate_email_address
