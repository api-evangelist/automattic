  /wpcom/v2/emails/titan/{domain}/mailbox/create:
    post:
      operationId: postWpcomV2EmailsTitanbyDomainMailboxCreate
      summary: POST /wpcom/v2/emails/titan/{domain}/mailbox/create
      tags:
      - emails
      responses:
        '200':
          description: OK
        '401':
