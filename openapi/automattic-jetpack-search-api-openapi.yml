          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      parameters:
      - name: wpcom_site
        in: path
        required: true
        schema:
          type: string
      - name: cache_key
        in: query
        required: true
        schema: {}
        description: Cache key of your response
      - name: comment
        in: query
        required: false
        schema: {}
        description: Optional feedback
      - name: rank
        in: query
        required: false
        schema: {}
        description: How do you rank this response
  /wpcom/v2/sites/{wpcom_site}/jetpack-search/ai/search:
