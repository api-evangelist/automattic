      parameters:
      - name: wpcom_site
        in: path
        required: true
        schema:
          type: string
      - name: query
        in: query
        required: true
        schema: {}
        description: Your question to the site
      - name: stop_at
        in: query
        required: false
        schema:
          default: full
        description: 'Which stage to return: urls (fast preview) or response (full answer).'
      - name: session_id
        in: query
        required: false
        schema: {}
        description: Conversation session id to continue.
