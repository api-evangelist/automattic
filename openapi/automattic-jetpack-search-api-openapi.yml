paths:
  /wpcom/v2/jetpack-search/pricing:
    get:
      operationId: getWpcomV2JetpackSearchPricing
      summary: GET /wpcom/v2/jetpack-search/pricing
      tags:
      - jetpack-search
      responses:
        '200':
          description: OK
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPRestError'
      parameters:
      - name: record_count
        in: query
        required: false
        schema:
          type: integer
          default: 0
        description: Record count to estimate pricing
      - name: search_request_count
        in: query
        required: false
        schema:
          type: integer
          default: 0
        description: Search request count to estimate pricing
      - name: locale
        in: query
        required: false
        schema: {}
        description: (string) Locale for translating strings in response data
      - name: currency
        in: query
        required: false
        schema: {}
        description: (string) Manually request currency code of response.
