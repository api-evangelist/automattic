paths:
  /sites/{site}/protect/recovery/confirm:
    post:
      operationId: postSitesBySiteProtectRecoveryConfirm
      summary: A site confirms that a user can bypass jetpack to try to login and login
      description: A site confirms that a user can bypass jetpack to try to login and login
      tags:
      - protect
      responses:
        '200':
          description: OK
          content:
            application/json:
