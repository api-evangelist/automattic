  title: No route was found matching the URL and request method.
  remediation: Check the namespace, version and HTTP method; consult the route index at /wp/v2/ or /wpcom/v2/.
  observed_at: https://public-api.wordpress.com/wpcom/v2/nope
envelope_override:
  param: http_envelope
  description: >-
    Setting http_envelope=true on any /rest/v1.x request forces HTTP 200 and moves the real status
    code and headers into the JSON body, so agents must inspect the body — not the transport
    status — whenever this parameter is set.
