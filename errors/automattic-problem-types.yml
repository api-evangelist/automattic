- status: 401
  envelope: wp-rest
  code: rest_forbidden
  title: Sorry, you are not allowed to do that.
  remediation: The token is missing the scope or site capability required for this endpoint.
  observed_at: https://public-api.wordpress.com/wp/v2/sites/en.blog.wordpress.com/settings
