mcp_only:
- tool: wpcom-domain-update-dns-records
  reason: >-
    No public DNS-record write operation is exposed in the harvested wpcom/v2 route index; the
    tool composes a private/administrative domain management call.
- tool: wpcom-domain-restore-default-dns-records
  reason: same as wpcom-domain-update-dns-records — no matching public REST operation harvested.
- tool: wpcom-domain-update-nameservers
  reason: no matching public REST operation harvested.
- tool: wpcom-domain-set-mail-service
  reason: composite (writes several DNS records in one call); no single backing REST operation.
- tool: wpcom-checkout-url
  reason: >-
    Generates a pre-configured wordpress.com checkout URL rather than calling a documented REST
    operation; the closest REST surface is the ucp checkout-sessions family, which is not the same contract.
