source: mcp/automattic-mcp.yml + openapi/ (operationIds verified by grep against each spec)
summary: >-
  Automattic's WordPress.com MCP server exposes a small number of coarse "facade" tools whose
  sub-operations (posts.list, media.create, …) fan out to the same WordPress.com REST surface the
  OpenAPI documents describe. Because the live tools/list handshake is OAuth-gated, tools are bound
  to backing operations by name and documented semantics, not by observed inputSchema — confidence
  is recorded accordingly. Every operationId below was verified to exist verbatim in the referenced
  spec file.
surfaces:
  openapi:
  - openapi/automattic-wordpress-com-rest-v1-1-openapi.yml
  - openapi/automattic-wordpress-com-wp-v2-openapi.yml
  - openapi/automattic-wordpress-com-wpcom-v2-openapi.yml
  - openapi/automattic-jetpack-ai-plugin-openapi.yaml
  - openapi/automattic-akismet-openapi.yml
  graphql: null
  mcp:
    url: https://public-api.wordpress.com/wpcom/v2/mcp/v1
    gated: true
    gate: OAuth 2.1 bearer; tools/list returns 401 rest_unauthorized
