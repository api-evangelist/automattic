tools:
- name: wpcom-mcp-content-authoring
  kind: facade
  description: >-
    Create, read, update, and delete content on a WordPress.com site — posts, pages,
    comments, media, categories, tags, block patterns, and content search.
  read_operations: [posts.list, posts.get, pages.list, pages.get, comments.list, comments.get,
    media.list, media.get, categories.list, categories.get, tags.list, tags.get,
    patterns.list, patterns.get, synced-patterns.list, synced-patterns.get, content-search]
  write_operations: [posts.create, posts.update, posts.delete, pages.create, pages.update,
    pages.delete, comments.create, comments.update, comments.delete, media.create,
    media.update, media.delete, categories.create, categories.update, categories.delete,
    tags.create, tags.update, tags.delete]
- name: wpcom-mcp-site-editor-context
  kind: facade
  description: Query site design context — theme presets, applied styles, and registered block types.
  read_operations: [theme.active, theme.presets, theme.styles, blocks.allowed]
  write_operations: []
- name: wpcom-mcp-account
  kind: facade
  description: >-
    Manage the authenticated user's WordPress.com account — profile, notifications,
    achievements, domains, connections, security, and currency.
  read_operations: [profile.get, notifications.get, inbox.get, achievements.get, domains.list,
    domains.get, domains.dns_records, connections.get, security.get, currency.preview]
  write_operations: [profile.update, notifications.update, domains.set_primary, currency.change]
- name: wpcom-mcp-site
  kind: facade
  description: >-
    Manage a WordPress.com site — settings, statistics, plugins, activity log, themes,
    and Jetpack module configuration.
  read_operations: [settings.get, statistics.get, plugin.list, activity.get, theme.list,
    monitor.status, newsletter.status, newsletter.get_settings, account-protection.status,
    manage-site.status]
  write_operations: [settings.update, theme.set, monitor.activate, monitor.deactivate,
    account-protection.activate, account-protection.deactivate, manage-site.launch,
    manage-site.set-visibility]
- name: wpcom-user-sites
  kind: standalone
  access: read
  description: >-
    List the authenticated user's accessible sites across WordPress.com and self-hosted
    Jetpack-connected sites.
- name: wpcom-domain-purchase
  kind: standalone
  access: read
  description: Search for available domains and generate checkout links for registration on WordPress.com.
- name: wpcom-domain-update-dns-records
  kind: standalone
  access: write
  description: Add or remove DNS records for a single custom domain you manage.
- name: wpcom-domain-restore-default-dns-records
  kind: standalone
  access: write
  description: Restore the WordPress.com default A records or the default www CNAME for a single custom domain.
- name: wpcom-domain-update-nameservers
  kind: standalone
  access: write
  description: Set the nameservers for a single custom domain.
- name: wpcom-domain-set-mail-service
  kind: standalone
  access: write
  description: Configure DNS records on a domain for an external mail service.
- name: wpcom-checkout-url
  kind: standalone
  access: read
  description: Generate a pre-configured WordPress.com checkout URL for products or subscription renewal.
- name: wpcom-plans-list
  kind: standalone
  access: read
  description: List WordPress.com plans with prices and per-tier feature lists.
