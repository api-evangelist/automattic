    types, block patterns, global styles, templates, plugins, themes, settings and the WordPress
    Abilities API. Chosen when portability with self-hosted WordPress matters.
  humanURL: https://developer.wordpress.com/docs/api/
  baseURL: https://public-api.wordpress.com/wp/v2
  tags:
