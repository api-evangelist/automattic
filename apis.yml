aid: automattic
name: Automattic
description: >-
  Automattic is the company behind WordPress.com, Jetpack, WooCommerce, Tumblr, Gravatar, Akismet,
  WordPress VIP, Pocket Casts, Day One, Beeper and Simplenote. Its developer platform centres on the
  WordPress.com REST API at public-api.wordpress.com, which serves three parallel namespaces — the
  WordPress.com-native /rest/v1.x family, the WordPress-core-compatible /wp/v2 family, and the
  WordPress.com and Jetpack platform extensions in /wpcom/v2 — all behind a single OAuth 2.1 and
  OpenID Connect authorization server with PKCE, dynamic client registration and resource
  indicators. Every /rest/ version publishes a machine-readable help document and every /wp/ and
  /wpcom/ namespace publishes a route index, so the whole surface is self-describing even though
  Automattic does not ship OpenAPI for it. Automattic also runs a hosted Model Context Protocol
  server for WordPress.com, publishes OpenAPI for Akismet and for the Jetpack ai-plugin surface, and
  exposes a GraphQL Platform API for the enterprise WordPress VIP product.
image: https://automattic.com/wp-content/uploads/2024/11/cropped-automattic-logo-square.png
url: https://raw.githubusercontent.com/api-evangelist/automattic/refs/heads/main/apis.yml
