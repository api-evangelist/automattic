apis:
- name: WordPress.com MCP Server
  description: >-
    Automattic's hosted Model Context Protocol server for WordPress.com. Streamable HTTP transport secured
    with OAuth 2.1 (PKCE S256, dynamic client registration, token rotation, no client secret). Twelve
    documented tools spanning content authoring, site editor context, account and site administration,
    domains, plans and checkout. Read-only tools are enabled by default and write tools must be explicitly
    turned on. Available on all WordPress.com paid plans.
  humanURL: https://developer.wordpress.com/docs/mcp/
  baseURL: https://public-api.wordpress.com/wpcom/v2/mcp/v1
  tags:
  - MCP
  - Developer Tools
  - Content Management
  tags_raw:
  - Model Context Protocol
  - Developer Tools
  - Content Management
  properties:
  - type: MCPServer
    url: mcp/automattic-mcp.yml
  - type: ToolCrosswalk
    url: mcp/automattic-tool-crosswalk.yml
  - type: Documentation
    url: https://developer.wordpress.com/docs/mcp/
  - type: APIReference
    url: https://developer.wordpress.com/docs/mcp/tools/
- name: WordPress VIP Platform API
  description: >-
    The GraphQL API for WordPress VIP, Automattic's enterprise WordPress and Node.js platform. Documented
    operation categories cover apps, domains, organizations, users, integrations, security and observability.
    Introspection is authentication-gated, so no SDL is captured.
  humanURL: https://docs.wpvip.com/vip-api/
  baseURL: https://api.wpvip.com/graphql
  tags:
  - Website Hosting
  - Developer Tools
  - Enterprise
  properties:
  - type: GraphQL
    url: graphql/automattic-vip-platform-api.yml
  - type: Documentation
    url: https://docs.wpvip.com/vip-api/
  - type: GettingStarted
    url: https://docs.wpvip.com/vip-api/getting-started
  - type: APIReference
