- name: WordPress.com REST API v1.1
  description: >-
    The primary WordPress.com REST API. 253 endpoints covering sites, posts, pages, comments,
    media, taxonomy, menus, themes, stats, Reader subscriptions, notifications, sharing and account
    management. Self-describing: every endpoint's method, path, parameters and response fields are
    published at /rest/v1.1/help.
  humanURL: https://developer.wordpress.com/docs/api/
  baseURL: https://public-api.wordpress.com/rest/v1.1
