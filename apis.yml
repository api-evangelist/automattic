  - type: Documentation
    url: https://developer.wordpress.com/docs/api/
- name: WordPress.com REST API - wpcom/v2 namespace
  description: >-
    The WordPress.com and Jetpack platform extension namespace — 1,716 operations covering hosting
    and code deployments, domains and DNS, plans and checkout, marketplace, agency tooling,
    Jetpack modules, AI features and the hosted MCP server. The largest of the three namespaces.
  humanURL: https://developer.wordpress.com/docs/api/
  baseURL: https://public-api.wordpress.com/wpcom/v2
