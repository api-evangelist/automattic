  - type: Documentation
    url: https://developer.wordpress.com/docs/api/
- name: WordPress.com MCP Server
  description: >-
    Automattic's hosted Model Context Protocol server for WordPress.com. Streamable HTTP transport
    secured with OAuth 2.1 (PKCE S256, dynamic client registration, token rotation, no client
    secret). Twelve documented tools spanning content authoring, site editor context, account and
    site administration, domains, plans and checkout. Read-only tools are enabled by default and
    write tools must be explicitly turned on. Available on all WordPress.com paid plans.
  humanURL: https://developer.wordpress.com/docs/mcp/
  baseURL: https://public-api.wordpress.com/wpcom/v2/mcp/v1
  tags:
  - Model Context Protocol
  - Developer Tools
  - Content Management
  properties:
  - type: MCPServer
    url: mcp/automattic-mcp.yml
  - type: ToolCrosswalk
    url: mcp/automattic-tool-crosswalk.yml
  - type: Documentation
    url: https://developer.wordpress.com/docs/mcp/
  - type: APIReference
    url: https://developer.wordpress.com/docs/mcp/tools/
- name: Akismet API
  description: >-
    Akismet is Automattic's spam-classification service. Six operations — key verification, comment
    check, submit spam, submit ham, key sites and usage limit — authenticated with an Akismet API
    key. Automattic publishes an OpenAPI 3.0.3 document for it.
  humanURL: https://akismet.com/development/api/
  baseURL: https://rest.akismet.com
  tags:
  - Spam Filtering
  - Comments
  - Content
  properties:
  - type: OpenAPI
    url: openapi/automattic-akismet-openapi.yml
  - type: Overlay
    url: overlays/automattic-akismet-overlay.yaml
  - type: Documentation
    url: https://akismet.com/development/api/
  - type: SourceCode
    url: https://github.com/Automattic/akismet-api
- name: Jetpack AI-Plugin API
  description: >-
    A small OpenAPI-described surface for listing and creating blog posts across a user's Jetpack
    and WordPress.com sites, published alongside the OpenAI plugin manifest at
    /.well-known/ai-plugin.json.
  humanURL: https://developer.wordpress.com/docs/api/
  baseURL: https://public-api.wordpress.com
  tags:
  - Publishing
  - Content Management
  properties:
  - type: OpenAPI
    url: openapi/automattic-jetpack-ai-plugin-openapi.yaml
  - type: Overlay
    url: overlays/automattic-jetpack-ai-plugin-overlay.yaml
  - type: PluginManifest
    url: well-known/automattic-ai-plugin.json
- name: WordPress VIP Platform API
  description: >-
    The GraphQL API for WordPress VIP, Automattic's enterprise WordPress and Node.js platform.
    Documented operation categories cover apps, domains, organizations, users, integrations,
    security and observability. Introspection is authentication-gated, so no SDL is captured.
  humanURL: https://docs.wpvip.com/vip-api/
  baseURL: https://api.wpvip.com/graphql
